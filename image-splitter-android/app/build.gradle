plugins {
    id 'com.android.application'
}

android {
    namespace 'com.imagesplitter.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.imagesplitter.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            // Committed key so every build is signed the same way and installs
            // as an update over the previous one. Override with your own key via
            // the SIGNING_* environment variables for anything you distribute.
            storeFile file(System.getenv('SIGNING_STORE_FILE') ?: 'release.keystore')
            storePassword System.getenv('SIGNING_STORE_PASSWORD') ?: 'imagesplitter'
            keyAlias System.getenv('SIGNING_KEY_ALIAS') ?: 'imagesplitter'
            keyPassword System.getenv('SIGNING_KEY_PASSWORD') ?: 'imagesplitter'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
